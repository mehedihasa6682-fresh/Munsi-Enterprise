name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f ./app/google-services.json ]; then
            echo "Creating fallback google-services.json for build..."
            echo '{"project_info":{"project_number":"745870059059","project_id":"munsi-b272a","storage_bucket":"munsi-b272a.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:745870059059:android:2b65b39dc90d40ecc5e546","android_client_info":{"package_name":"com.aistudio.ordercut.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyBIJMMMOg2rPmNvRnI8zIPAt-jVPk57dzA"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > ./app/google-services.json
          fi

      - name: Ensure Keystore exists
        run: |
          if [ ! -f ./debug.keystore ] && [ ! -f ./my-upload-key.jks ]; then
            echo "Generating signing keystore for build..."
            keytool -genkeypair -v -keystore ./debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderCutPro-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
